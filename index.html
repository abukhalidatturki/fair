<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Книжная ярмарка — учёт продаж</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,500;0,700;0,800;1,500&family=Golos+Text:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
(function(){ try {
  var t = window.Telegram && window.Telegram.WebApp, dark;
  if (t && t.initData) dark = t.colorScheme === 'dark';
  else dark = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
} catch(e){} })();
</script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --table:#e7e9e3;--paper:#f8f9f6;--ink:#1c2420;--muted:#6c756f;--line:rgba(28,36,32,.11);
  --primary:#1f4d3f;--primary-ink:#f4efe2;--active:#1f4d3f;
  --gold:#a8832f;--foil:#dcbd6c;--other:#8c949d;--umber:#7a5232;--danger:#b3362f;
  --cream:#f5edd9;--cover-ink:#f6eedb;--toast:#1c2420;--toast-ink:#f3f4f0;
  --serif:"Alegreya",Georgia,"Times New Roman",serif;
  --sans:"Golos Text",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --sb:max(env(safe-area-inset-bottom,0px),var(--tg-safe-area-inset-bottom,0px));
  color-scheme:light;
}
[data-theme=dark]{
  --table:#121614;--paper:#1b211e;--ink:#e7ebe6;--muted:#8d968f;--line:rgba(231,235,230,.09);
  --primary:#d3af62;--primary-ink:#19150a;--active:#d3af62;
  --gold:#d3af62;--other:#6d7570;--danger:#ff7b6e;--toast:#e7ebe6;--toast-ink:#121614;
  color-scheme:dark;
}
html,body{margin:0;background:var(--table);color:var(--ink);font:15px/1.4 var(--sans)}
body{padding-bottom:calc(68px + var(--sb))}
button{font:inherit;cursor:pointer;touch-action:manipulation;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:lining-nums tabular-nums}

.top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:14px 16px 8px}
.top h1{font:800 23px/1.1 var(--serif);margin:0;letter-spacing:-.2px}
.sync{font-size:12px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync[data-s=ok] i{background:#3f9b6e}.sync[data-s=saving] i,.sync[data-s=loading] i{background:var(--gold)}.sync[data-s=err] i{background:var(--danger)}
.view{display:none;padding:4px 12px 18px}.view.on{display:block}

/* ledger: the day's totals */
.ledger{background:var(--paper);border-radius:16px;padding:14px 16px 14px;margin-bottom:12px}
.lg-row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.lg-k{font-size:13px;color:var(--muted)}
.lg-sum{font:800 38px/1.05 var(--serif);letter-spacing:-.5px;font-variant-numeric:lining-nums tabular-nums;margin-top:2px}
.lg-count{text-align:right;color:var(--muted);font-size:13px;line-height:1.2}
.lg-count b{display:block;color:var(--ink);font:700 24px/1.1 var(--sans);font-variant-numeric:tabular-nums}
.lg-bar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--line);margin:12px 0 10px}
.lg-bar i{display:block;height:100%}
.lg-bar .own{background:var(--primary)}.lg-bar .oth{background:var(--other)}
.lg-split{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:13px;color:var(--muted)}
.lg-split b{display:block;color:var(--ink);font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:1px}
.lg-split b small{font-weight:500;color:var(--muted);font-size:13px;margin-left:4px}
.sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:0}
.sw.own{background:var(--primary)}.sw.oth{background:var(--other)}

.chips{display:flex;gap:6px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:0;background:var(--paper);color:var(--ink);padding:8px 14px;border-radius:999px;font-size:14px;font-weight:500;white-space:nowrap;flex:none}
.chip.on{background:var(--ink);color:var(--table)}
.search{width:100%;border:0;background:var(--paper);color:var(--ink);border-radius:12px;padding:11px 13px;font:inherit;font-size:16px;margin-bottom:12px;outline:none}
.search::placeholder{color:var(--muted)}

/* book covers */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 12px}
@media (min-width:560px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.cover{position:relative;border:0;padding:0;text-align:left;color:var(--cover-ink);background:var(--c);border-radius:3px 8px 8px 3px;min-height:188px;display:flex;flex-direction:column;overflow:hidden;user-select:none;-webkit-user-select:none;box-shadow:0 1px 0 rgba(0,0,0,.18),0 10px 18px -12px rgba(0,0,0,.55);transition:transform .09s ease}
.cover::before{content:"";position:absolute;left:0;top:0;bottom:0;width:13px;background:linear-gradient(90deg,rgba(0,0,0,.38),rgba(0,0,0,.12) 62%,rgba(255,255,255,.13) 80%,rgba(0,0,0,.18));z-index:1}
.cover::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.03) 0 1px,transparent 1px 3px),linear-gradient(180deg,rgba(255,255,255,.07),transparent 40%,rgba(0,0,0,.12));pointer-events:none}
.cover:active{transform:scale(.965)}
.cv-body{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;padding:11px 12px 8px 23px}
.cover.own .cv-body::before{content:"";position:absolute;inset:6px 7px 2px 17px;border:1px solid rgba(220,189,108,.6);border-radius:2px;box-shadow:inset 0 0 0 3px var(--c),inset 0 0 0 4px rgba(220,189,108,.38);pointer-events:none}
.cv-top{display:flex;justify-content:flex-end;gap:6px;min-height:25px;position:relative}
.cv-count{background:var(--foil);color:#211906;border-radius:999px;padding:3px 9px;font:700 13px/19px var(--sans);font-variant-numeric:tabular-nums}
.cv-minus{background:rgba(0,0,0,.34);color:var(--cover-ink);border-radius:999px;padding:5px 12px;margin:-2px 0;font:700 14px/19px var(--sans);box-shadow:inset 0 0 0 1px rgba(246,238,219,.25)}
.cv-minus:active{background:rgba(0,0,0,.5)}
.cv-title{position:relative;font:700 18px/1.14 var(--serif);margin-top:4px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word;text-wrap:balance}
.cv-imprint{position:relative;margin-top:auto;padding-top:8px;font:italic 500 13.5px/1.2 var(--serif);color:rgba(246,238,219,.72);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cover.own .cv-imprint{color:var(--foil)}
.cv-tag{position:relative;z-index:2;margin:0 9px 9px 20px;background:var(--cream);color:#2a2418;border-radius:4px;padding:6px 9px 6px 10px;display:flex;justify-content:space-between;align-items:baseline;gap:6px;box-shadow:0 1px 2px rgba(0,0,0,.28)}
.cv-price{font:800 17px/1.2 var(--sans);font-variant-numeric:tabular-nums;white-space:nowrap}
.cv-left{font:500 12px var(--sans);color:#6f6553;white-space:nowrap;font-variant-numeric:tabular-nums}
.cover.photo{background:#e9e6df;aspect-ratio:225/288;min-height:0}
.cover.photo::before,.cover.photo::after{display:none}
.cover.photo .cv-body::before{display:none!important}
.cv-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.cover.photo .cv-body{padding:8px 8px 0}
.cover.photo .cv-tag{margin:0 8px 8px;box-shadow:0 2px 8px rgba(0,0,0,.28)}
.cv-mine{margin-right:auto;background:var(--foil);color:#211906;border-radius:999px;padding:3px 9px;font:700 12px/19px var(--sans)}
.cover.photo .cv-minus{background:rgba(20,24,22,.62);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.cover.out{filter:grayscale(.9) brightness(.8)}
.cover.out .cv-left{color:#a3322a;font-weight:700}
.cover.flash{animation:lift .55s ease}
.cover.flash .cv-tag{animation:tag .55s ease}
.cover.flash .cv-count{animation:pop .4s ease}
@keyframes lift{0%{box-shadow:0 0 0 3px var(--foil),0 10px 18px -12px rgba(0,0,0,.55)}}
@keyframes tag{0%{background:var(--foil)}}
@keyframes pop{0%{transform:scale(1.35)}}
@media (prefers-reduced-motion:reduce){.cover.flash,.cover.flash .cv-tag,.cover.flash .cv-count{animation:none}.cover{transition:none}}

/* lists */
.group-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px;font-weight:600;color:var(--muted);margin:20px 4px 7px}
.group-h span:first-child{color:var(--ink);font:700 17px var(--serif)}
.group-h span:last-child{white-space:nowrap;font-variant-numeric:tabular-nums;font-size:13px}
.list{background:var(--paper);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;color:var(--ink);text-align:left;padding:12px 14px;border-top:1px solid var(--line)}
.list>.row:first-child{border-top:0}
.r-thumb{width:38px;height:49px;object-fit:cover;border-radius:3px;flex:none;background:#e9e6df}
.photos{display:flex;gap:8px;overflow-x:auto;padding:6px 2px 4px;margin-top:2px;scrollbar-width:none}
.photos::-webkit-scrollbar{display:none}
.ph{flex:none;width:62px;height:80px;border:0;padding:0;border-radius:6px;overflow:hidden;background:var(--paper);color:var(--muted);font-size:11.5px;line-height:1.2;box-shadow:0 0 0 1px var(--line)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph.on{box-shadow:0 0 0 3px var(--gold)}
.ph.none{padding:6px}
.cat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 10px}
.cat-i{border:0;background:none;padding:0;text-align:left;color:var(--ink);display:flex;flex-direction:column;gap:3px}
.cat-i img{width:100%;aspect-ratio:225/288;object-fit:cover;border-radius:6px;background:#e9e6df;margin-bottom:3px}
.cat-t{font:700 13.5px/1.2 var(--serif)}
.cat-v{font-size:12px;color:var(--muted)}
.cat-p{font-size:13px;font-weight:700}
.cat-p em{font-style:normal;font-weight:500;color:var(--muted);font-size:11.5px;display:block}
.r-spine{width:6px;align-self:stretch;border-radius:2px;background:var(--c);flex:none}
.r-main{flex:1;min-width:0}
.r-title{font:700 16.5px/1.2 var(--serif);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.r-sub{font-size:13px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
.r-end{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.r-end b{display:block;font-size:17px;font-weight:700}
.r-end small{color:var(--muted);font-size:12px}
.r-time{font-size:13px;color:var(--muted);width:44px;flex:none;font-variant-numeric:tabular-nums}
.r-time.wide{width:86px}
.ret{border:0;background:var(--table);color:var(--ink);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:650;flex:none}
.ret:active{background:var(--line)}
#recent .group-h span:last-child{font-weight:500}
.del{border:0;background:none;color:var(--danger);font-size:22px;line-height:1;padding:4px 2px 4px 8px}

.settle{background:var(--paper);border-radius:16px;padding:6px 16px 12px;margin-bottom:4px}
.st-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.st-row:first-child{border-top:0}
.st-row b{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.st-row.total{border-top:1.5px solid var(--ink)}
.st-row.total span{font:700 18px var(--serif)}
.st-row.total b{font:800 24px var(--serif);font-variant-numeric:lining-nums tabular-nums;color:var(--primary)}
[data-theme=light] .st-row.total b{color:var(--primary)}
.st-sub{font:700 16px var(--serif);margin:14px 0 2px}
.st-row.owe span small{display:block;font-size:12px;color:var(--muted)}
.st-warn{margin-top:10px;font-size:13px;line-height:1.45;color:var(--danger)}
.miss{color:var(--danger)}
.opt{font-size:12px;opacity:.85}
.btn{display:block;width:100%;border:0;border-radius:13px;padding:14px;font-weight:650;background:var(--paper);color:var(--ink);margin-top:8px;text-align:center}
.btn.primary{background:var(--primary);color:var(--primary-ink)}
.btn.danger{color:var(--danger)}
.btns{display:flex;gap:8px}.btns .btn{flex:1}
.hint{font-size:13px;color:var(--muted);margin:10px 4px;line-height:1.45}
.empty{text-align:center;color:var(--muted);padding:40px 18px}
.empty b{display:block;color:var(--ink);font:700 22px var(--serif);margin-bottom:8px}
.section-t{font:700 17px var(--serif);color:var(--ink);margin:28px 4px 4px}
details.log{margin-top:18px}
details.log summary{list-style:none;font-size:14px;font-weight:600;color:var(--ink);padding:6px 4px 9px;cursor:pointer}
details.log summary::-webkit-details-marker{display:none}
details.log summary::after{content:" ▾";color:var(--muted)}
details.log[open] summary::after{content:" ▴"}

.nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--paper);border-top:1px solid var(--line);padding-bottom:var(--sb);z-index:5}
.nav button{flex:1;border:0;background:none;color:var(--muted);font-size:11.5px;font-weight:500;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:3px}
.nav button.on{color:var(--active);font-weight:700}
.nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.toast{position:fixed;left:12px;right:12px;bottom:calc(76px + var(--sb));background:var(--toast);color:var(--toast-ink);border-radius:13px;padding:13px 15px;display:flex;align-items:center;gap:12px;font-size:14px;transform:translateY(14px);opacity:0;pointer-events:none;transition:.18s;z-index:20;box-shadow:0 10px 30px -10px rgba(0,0,0,.45)}
.toast.on{opacity:1;transform:none;pointer-events:auto}
.toast span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast button{border:0;background:none;color:var(--gold);font-weight:700;padding:0;white-space:nowrap}
[data-theme=light] .toast button{color:var(--foil)}
[data-theme=dark] .toast button{color:#7a5a12}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}

.ov{position:fixed;inset:0;background:rgba(10,14,12,.45);display:none;align-items:flex-end;justify-content:center;z-index:30}
.ov.on{display:flex}
.sheet{background:var(--table);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + var(--sb));max-height:92vh;overflow:auto}
.sheet h3{margin:0 0 14px;font:800 22px var(--serif);display:flex;justify-content:space-between;align-items:center;gap:10px}
.x{border:0;background:var(--paper);color:var(--muted);width:34px;height:34px;border-radius:50%;font-size:19px;line-height:1;flex:none}
.fld{display:block;margin-bottom:12px;font-size:13px;color:var(--muted)}
.fld input,.fld textarea{display:block;width:100%;margin-top:5px;border:0;border-radius:12px;background:var(--paper);color:var(--ink);padding:12px 13px;font:inherit;font-size:16px;outline:none}
.fld input:focus,.fld textarea:focus{box-shadow:0 0 0 2px var(--gold)}
.fld textarea{min-height:140px;resize:vertical;font-size:13px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;background:var(--paper);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;color:var(--ink);padding:10px 6px;border-radius:9px;font-weight:500}
.seg button.on{background:var(--primary);color:var(--primary-ink);font-weight:650}
.seg.oth button.on{background:var(--umber);color:#f6eedb}
.err{color:var(--danger);font-size:13px;min-height:18px;margin:2px 4px}
</style>
</head>
<body>

<div class="top"><h1>Книжная ярмарка</h1><div class="sync" id="sync"><i></i><span></span></div></div>

<section class="view" id="v-sell">
  <div id="sell-sum"></div>
  <div class="chips" id="sell-filters">
    <button class="chip" data-filter="all">Все</button>
    <button class="chip" data-filter="own">Мои</button>
    <button class="chip" data-filter="oth">Другие издательства</button>
  </div>
  <input class="search" id="search" type="search" placeholder="Поиск книги…" autocomplete="off" style="display:none">
  <div id="grid"></div>
  <div id="recent"></div>
</section>

<section class="view" id="v-books"></section>
<section class="view" id="v-report"></section>

<nav class="nav">
  <button data-tab="sell"><svg viewBox="0 0 24 24"><path d="M3 4h2l2.2 10.2a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 2-1.5L20.5 8H6.1"/><circle cx="10" cy="20" r="1.3"/><circle cx="17" cy="20" r="1.3"/></svg>Продажа</button>
  <button data-tab="books"><svg viewBox="0 0 24 24"><path d="M4 19.5V5a2 2 0 0 1 2-2h13v15H6a2 2 0 0 0-2 2 1.5 1.5 0 0 0 1.5 1.5H19"/><path d="M9 7h6"/></svg>Книги</button>
  <button data-tab="report"><svg viewBox="0 0 24 24"><path d="M5 20V10"/><path d="M12 20V4"/><path d="M19 20v-7"/></svg>Отчёт</button>
</nav>

<div class="toast" id="toast"><span id="toast-t"></span><button id="toast-b" style="display:none">Отменить</button></div>
<div class="ov" id="ov"></div>

<script>
(function(){
'use strict';

/* ---------- Telegram ---------- */
var tg = (window.Telegram && window.Telegram.WebApp) || null;
var inTG = !!(tg && tg.initData);
function ver(v){ try { return !!(tg && tg.isVersionAtLeast(v)); } catch(e){ return false; } }
if (tg) {
  try { tg.ready(); tg.expand(); } catch(e){}
  try { tg.onEvent('themeChanged', applyTheme); } catch(e){}
  if (ver('7.7')) { try { tg.disableVerticalSwipes(); } catch(e){} }
}
var cloud = (inTG && ver('6.9') && tg.CloudStorage) ? tg.CloudStorage : null;

function applyTheme(){
  var dark;
  if (inTG) dark = tg.colorScheme === 'dark';
  else dark = !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  if (inTG && ver('6.9')) {
    var bg = dark ? '#121614' : '#e7e9e3', bar = dark ? '#1b211e' : '#f8f9f6';
    try { tg.setHeaderColor(bg); tg.setBackgroundColor(bg); } catch(e){}
    if (ver('7.10')) { try { tg.setBottomBarColor(bar); } catch(e){} }
  }
}
applyTheme();

function haptic(kind){
  if (!inTG || !ver('6.1')) return;
  try {
    if (kind === 'sell') tg.HapticFeedback.impactOccurred('medium');
    else if (kind === 'undo') tg.HapticFeedback.impactOccurred('light');
    else if (kind === 'warn') tg.HapticFeedback.notificationOccurred('warning');
    else tg.HapticFeedback.notificationOccurred('success');
  } catch(e){}
}
function confirmDlg(msg, cb){
  if (inTG && ver('6.2')) { try { tg.showConfirm(msg, function(ok){ cb(!!ok); }); return; } catch(e){} }
  cb(window.confirm(msg));
}
function alertDlg(msg){
  if (inTG && ver('6.2')) { try { tg.showAlert(msg); return; } catch(e){} }
  window.alert(msg);
}

/* ---------- helpers ---------- */
var $ = function(s){ return document.querySelector(s); };
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function num(n){ return (Math.round(n*100)/100).toLocaleString('ru-RU'); }
function money(n){ return num(n) + ' ₽'; }
function uid(){ return Date.now().toString(36).slice(-5) + Math.random().toString(36).slice(2,6); }
function pad(n){ return String(n).padStart(2,'0'); }
function dayKey(ts){ var d = new Date(ts); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
var MONTHS = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
function dayLabel(k){ if (k === dayKey(Date.now())) return 'Сегодня'; var p = k.split('-'); return (+p[2]) + ' ' + MONTHS[+p[1]-1]; }
function dayFull(k){ var p = k.split('-'); return p[2]+'.'+p[1]+'.'+p[0]; }

/* ---------- state ---------- */
// book: {id, t:title, o:own?, p:publisher name (for others), pr:price, q:brought qty, h:hidden}
// sale: [timestamp, bookId, price]
var LS = 'bookfair_state_v1', LS_UI = 'bookfair_ui_v1';
function normalize(s){
  s = (s && typeof s === 'object') ? s : {};
  return {
    v: 1,
    books: Array.isArray(s.books) ? s.books.filter(function(b){ return b && b.id; }).map(function(b){
      return { id:String(b.id), t:String(b.t || 'Без названия'), o:!!b.o, p:String(b.p || ''), pr:+b.pr || 0, q:Math.max(0, Math.floor(+b.q || 0)), h:!!b.h, img:(typeof b.img === 'string' ? b.img : undefined), c:(b.c === null || b.c === undefined || b.c === '' || !isFinite(+b.c)) ? null : +b.c };
    }) : [],
    sales: Array.isArray(s.sales) ? s.sales.filter(function(x){ return Array.isArray(x) && x.length >= 3; }).map(function(x){ return [+x[0], String(x[1]), +x[2] || 0]; }) : [],
    updatedAt: +s.updatedAt || 0
  };
}
var state = normalize(null);
try { var raw = localStorage.getItem(LS); if (raw) state = normalize(JSON.parse(raw)); } catch(e){}
var ui = { tab:'sell', filter:'all', period:'today', q:'' };
try { var u = JSON.parse(localStorage.getItem(LS_UI) || '{}'); if (u.tab) ui.tab = u.tab; if (u.filter) ui.filter = u.filter; } catch(e){}
function saveUI(){ try { localStorage.setItem(LS_UI, JSON.stringify({ tab:ui.tab, filter:ui.filter })); } catch(e){} }

function byId(id){ for (var i=0;i<state.books.length;i++) if (state.books[i].id === id) return state.books[i]; return null; }
function saveLocal(){ try { localStorage.setItem(LS, JSON.stringify(state)); } catch(e){} }
function persist(){ state.updatedAt = Date.now(); saveLocal(); scheduleCloud(); }

/* ---------- Telegram CloudStorage sync (chunked, 4000 chars per key) ---------- */
var CHUNK = 4000, cloudChunks = [], cloudReady = false, cloudBusy = false, cloudDirty = false, cloudTimer = null;
function cs(method){
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function(res, rej){
    try { cloud[method].apply(cloud, args.concat([function(err, val){ err ? rej(err) : res(val); }])); }
    catch(e){ rej(e); }
  });
}
function setSync(s){
  var t = { local:'на этом устройстве', loading:'загрузка…', saving:'сохраняю…', ok:'сохранено', err:'нет связи, данные в телефоне' }[s] || '';
  $('#sync').setAttribute('data-s', s);
  $('#sync span').textContent = t;
}
function scheduleCloud(){
  if (!cloud) return;
  cloudDirty = true;
  clearTimeout(cloudTimer);
  cloudTimer = setTimeout(flushCloud, 700);
}
function flushCloud(){
  if (!cloud || !cloudReady || cloudBusy || !cloudDirty) return;
  cloudBusy = true; cloudDirty = false; setSync('saving');
  var s = JSON.stringify(state), chunks = [];
  for (var i=0;i<s.length;i+=CHUNK) chunks.push(s.slice(i, i+CHUNK));
  var chain = Promise.resolve();
  chunks.forEach(function(c, i){ if (cloudChunks[i] !== c) chain = chain.then(function(){ return cs('setItem', 'c'+i, c); }); });
  chain.then(function(){
    return cs('setItem', 'meta', JSON.stringify({ n:chunks.length, u:state.updatedAt }));
  }).then(function(){
    var stale = [];
    for (var j=chunks.length;j<cloudChunks.length;j++) stale.push('c'+j);
    cloudChunks = chunks;
    if (stale.length) return cs('removeItems', stale).catch(function(){});
  }).then(function(){
    setSync('ok');
  }).catch(function(){
    setSync('err'); cloudDirty = true;
  }).then(function(){
    cloudBusy = false;
    if (cloudDirty) { clearTimeout(cloudTimer); cloudTimer = setTimeout(flushCloud, 2500); }
  });
}
function loadCloud(){
  if (!cloud) { setSync('local'); return; }
  setSync('loading');
  cs('getItem', 'meta').then(function(metaS){
    if (!metaS) { cloudReady = true; if (state.updatedAt) { cloudDirty = true; flushCloud(); } else setSync('ok'); return; }
    var meta = JSON.parse(metaS), keys = [];
    for (var i=0;i<meta.n;i++) keys.push('c'+i);
    return (keys.length ? cs('getItems', keys) : Promise.resolve({})).then(function(vals){
      var chunks = keys.map(function(k){ return (vals && vals[k]) || ''; });
      cloudChunks = chunks;
      cloudReady = true;
      if (meta.u > state.updatedAt) {
        try {
          var remote = normalize(JSON.parse(chunks.join('')));
          remote.updatedAt = meta.u;
          state = remote; saveLocal(); renderAll(); setSync('ok');
        } catch(e) { cloudDirty = true; flushCloud(); }
      } else if (meta.u < state.updatedAt || cloudDirty) { cloudDirty = true; flushCloud(); }
      else setSync('ok');
    });
  }).catch(function(){ cloudReady = true; setSync('err'); if (cloudDirty) flushCloud(); });
}

/* ---------- computed ---------- */
function soldMaps(){
  var all = {}, today = {}, tk = dayKey(Date.now());
  state.sales.forEach(function(s){ all[s[1]] = (all[s[1]]||0) + 1; if (dayKey(s[0]) === tk) today[s[1]] = (today[s[1]]||0) + 1; });
  return { all:all, today:today };
}
var OWN = '\u0000own';
function groupKey(b){ return b.o ? OWN : (b.p.trim() || 'Другое издательство'); }
function groupName(k){ return k === OWN ? 'Мои книги' : k; }
function grouped(books){
  var m = {}, order = [];
  books.forEach(function(b){ var k = groupKey(b); if (!m[k]) { m[k] = []; order.push(k); } m[k].push(b); });
  order.sort(function(a,b){ return a === OWN ? -1 : b === OWN ? 1 : a.localeCompare(b, 'ru'); });
  return order.map(function(k){ return [k, m[k]]; });
}

/* ---------- toast ---------- */
var toastTimer = null, toastUndo = null;
function toast(text, undo){
  $('#toast-t').textContent = text;
  toastUndo = undo || null;
  $('#toast-b').style.display = undo ? '' : 'none';
  $('#toast').classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ $('#toast').classList.remove('on'); toastUndo = null; }, undo ? 7000 : 2200);
}
$('#toast-b').addEventListener('click', function(){
  var f = toastUndo; toastUndo = null; $('#toast').classList.remove('on'); if (f) f();
});

/* ---------- selling ---------- */
var lastSold = null;
function sell(id){
  var b = byId(id); if (!b) return;
  var left = b.q - (soldMaps().all[id] || 0);
  if (left <= 0) {
    haptic('warn');
    confirmDlg('«' + b.t.slice(0,120) + '»: по учёту книги закончились. Всё равно отметить продажу?', function(ok){ if (ok) doSell(b); });
    return;
  }
  doSell(b);
}
function doSell(b){
  var sale = [Date.now(), b.id, b.pr];
  state.sales.push(sale);
  persist(); haptic('sell');
  lastSold = b.id; renderSell(); lastSold = null;
  toast('Продано: ' + b.t + ', ' + money(b.pr), function(){ removeSale(sale[0], sale[1]); haptic('undo'); renderAll(); toast('Продажа отменена'); });
}
function removeSale(ts, id){
  for (var i=state.sales.length-1;i>=0;i--) { if (state.sales[i][0] === ts && state.sales[i][1] === id) { state.sales.splice(i,1); persist(); return true; } }
  return false;
}
function restoreSale(sale){
  var i = state.sales.length;
  while (i > 0 && state.sales[i-1][0] > sale[0]) i--;
  state.sales.splice(i, 0, sale);
  persist(); renderAll(); toast('Продажа восстановлена');
}
function returnSale(sale){
  if (!removeSale(sale[0], sale[1])) return;
  haptic('undo'); renderAll();
  var b = byId(sale[1]);
  toast('Возврат: ' + (b ? b.t : 'книга') + ', ' + money(sale[2]), function(){ restoreSale(sale); });
}
function unsellLast(id){
  var tk = dayKey(Date.now());
  for (var i=state.sales.length-1;i>=0;i--) {
    var s = state.sales[i];
    if (s[1] === id && dayKey(s[0]) === tk) { returnSale(s.slice()); return; }
  }
}

function renderGrid(){

  if (!active.length) {
    $('#grid').innerHTML = '<div class="empty"><b>Пока нет книг</b>Добавьте книги, которые привезли на ярмарку: название, издательство, цену и количество.' +

/* ---------- render: report ---------- */
function periodKey(){ return ui.period === 'today' ? dayKey(Date.now()) : ui.period; }
function periodSales(){
  if (ui.period === 'all') return state.sales;
  var k = periodKey();
  return state.sales.filter(function(s){ return dayKey(s[0]) === k; });
}
function periodTitle(){ return ui.period === 'all' ? 'вся ярмарка' : dayFull(periodKey()); }
function buildReport(){
  var sales = periodSales(), per = {}, tot = { q:0, s:0 }, own = { q:0, s:0 };
  sales.forEach(function(s){
    var r = per[s[1]] || (per[s[1]] = { q:0, s:0, prices:{} });
    r.q++; r.s += s[2]; r.prices[s[2]] = 1;
    tot.q++; tot.s += s[2];
    var b = byId(s[1]); if (b && b.o) { own.q++; own.s += s[2]; }
  });
  var books = Object.keys(per).map(function(id){ return byId(id) || { id:id, t:'Удалённая книга', o:false, p:'—', pr:0, q:0 }; });
  var groups = grouped(books).map(function(g){
    var gq = 0, gs = 0;
    g[1].forEach(function(b){ gq += per[b.id].q; gs += per[b.id].s; });
    g[1].sort(function(a,b){ return per[b.id].s - per[a.id].s; });
    var gc = 0, missing = [];
    g[1].forEach(function(b){ if (b.c != null) gc += per[b.id].q * b.c; else missing.push(b); });
    return { key:g[0], own:g[0] === OWN, name:groupName(g[0]), q:gq, s:gs, books:g[1], cost:gc, missing:missing };
  });
  var owe = 0, ownCost = 0, missOth = [];
  groups.forEach(function(g){ if (g.own) ownCost += g.cost; else { owe += g.cost; missOth = missOth.concat(g.missing); } });
  return { sales:sales, per:per, tot:tot, own:own, oth:{ q:tot.q-own.q, s:tot.s-own.s }, groups:groups,
           owe:owe, ownCost:ownCost, profit:tot.s - owe - ownCost, missOth:missOth };
}
function renderReport(){
  var days = {}; days[dayKey(Date.now())] = 1;
  state.sales.forEach(function(s){ days[dayKey(s[0])] = 1; });
  var dk = Object.keys(days).sort().reverse(), today = dayKey(Date.now());
  if (ui.period !== 'today' && ui.period !== 'all' && !days[ui.period]) ui.period = 'today';
  var chips = '<div class="chips">' + dk.map(function(k){
    var val = k === today ? 'today' : k;
    return '<button class="chip' + (ui.period === val ? ' on' : '') + '" data-period="' + val + '">' + dayLabel(k) + '</button>';
  }).join('') + '<button class="chip' + (ui.period === 'all' ? ' on' : '') + '" data-period="all">Вся ярмарка</button></div>';

  var R = buildReport(), all = soldMaps().all, h = chips;
  h += ledger(ui.period === 'all' ? 'Вся ярмарка' : dayLabel(periodKey()), R.tot.q, R.tot.s, R.own.q, R.own.s);

  if (!R.tot.q) {
    h += '<div class="empty">За этот период продаж нет</div>';
    $('#v-report').innerHTML = h; return;
  }
  var others = R.groups.filter(function(g){ return !g.own; });
  h += '<div class="settle"><div class="st-row"><span>Выручка</span><b>' + money(R.tot.s) + '</b></div>' +
    (others.length ? '<div class="st-row"><span>Отдать издательствам</span><b>−' + money(R.owe) + '</b></div>' : '') +
    (R.ownCost > 0 ? '<div class="st-row"><span>Закупка моих книг</span><b>−' + money(R.ownCost) + '</b></div>' : '') +
    '<div class="st-row total"><span>Заработал</span><b>' + money(R.profit) + '</b></div>';
  if (others.length) {
    h += '<div class="st-sub">Кому сколько отдать</div>' + others.map(function(g){
      return '<div class="st-row owe"><span>' + esc(g.name) + '<small>' + pcs(g.q) + ' продано</small></span><b>' + money(g.cost) + '</b></div>';
    }).join('');
  }
  if (R.missOth.length) {
    h += '<div class="st-warn">Не указана закупочная цена: ' + R.missOth.map(function(b){ return '«' + esc(b.t) + '»'; }).join(', ') +
      '. Пока они не вошли в долг, поэтому заработок завышен. Укажите закупку во вкладке «Книги».</div>';
  }
  h += '</div>';

  R.groups.forEach(function(g){
    h += '<div class="group-h"><span>' + esc(g.name) + '</span><span>' + pcs(g.q) + ', ' + money(g.s) + '</span></div><div class="list">' +
      g.books.map(function(b){
        var r = R.per[b.id], pr = Object.keys(r.prices);
        var sub = pr.length === 1 ? r.q + ' × ' + money(+pr[0]) : pcs(r.q);
        var left = byId(b.id) ? ', осталось ' + (b.q - (all[b.id]||0)) : '';
        if (b.c != null) left += '<br>' + (g.own ? 'закупка ' : 'отдать ') + r.q + ' × ' + money(b.c) + ' = ' + money(r.q * b.c);
        else if (!g.own) left += '<br><span class="miss">закупка не указана</span>';
        return '<div class="row">' + spineOrThumb(b) + '<div class="r-main"><div class="r-title">' + esc(b.t) + '</div><div class="r-sub">' + sub + left + '</div></div>' +
          '<div class="r-end"><b>' + money(r.s) + '</b></div></div>';
      }).join('') + '</div>';
  });
  h += '<button class="btn primary" data-act="copy-report" style="margin-top:16px">Скопировать отчёт</button>';

  var log = R.sales.slice().sort(function(a,b){ return b[0]-a[0]; });
  h += '<details class="log"><summary>Все продажи за период (' + log.length + ')</summary><div class="list">' +
    log.map(function(s){
      var b = byId(s[1]);
      var t = ui.period === 'all' ? dayLabel(dayKey(s[0])) + ' ' + timeLabel(s[0]) : timeLabel(s[0]);
      return '<div class="row"><div class="r-time' + (ui.period === 'all' ? ' wide' : '') + '">' + t + '</div><div class="r-main"><div class="r-title">' + esc(b ? b.t : 'Удалённая книга') + '</div></div>' +
        '<div class="r-end">' + money(s[2]) + '</div><button class="del" data-delsale="' + s[0] + '|' + esc(s[1]) + '" aria-label="Удалить продажу">×</button></div>';
    }).join('') + '</div></details>';
  $('#v-report').innerHTML = h;
}
function reportText(){
  var R = buildReport(), all = soldMaps().all;
  var L = ['📚 Отчёт по продажам: ' + periodTitle(), 'Итого: ' + pcs(R.tot.q) + ' · ' + money(R.tot.s),
           'Мои: ' + pcs(R.own.q) + ' · ' + money(R.own.s) + '  |  Другие: ' + pcs(R.oth.q) + ' · ' + money(R.oth.s)];
  L.push('', 'Выручка: ' + money(R.tot.s));
  var oth = R.groups.filter(function(g){ return !g.own; });
  if (oth.length) {
    L.push('Отдать издательствам: ' + money(R.owe));
    oth.forEach(function(g){ L.push('  ' + g.name + ': ' + money(g.cost) + ' (' + pcs(g.q) + ')'); });
  }
  if (R.ownCost > 0) L.push('Закупка моих книг: ' + money(R.ownCost));
  L.push('Заработал: ' + money(R.profit));
  if (R.missOth.length) L.push('Без закупочной цены: ' + R.missOth.map(function(b){ return b.t; }).join(', '));
  R.groups.forEach(function(g){
    L.push('', g.name.toUpperCase() + ' — ' + pcs(g.q) + ' · ' + money(g.s) + (!g.own && g.cost ? ', отдать ' + money(g.cost) : ''));
    g.books.forEach(function(b){
      var r = R.per[b.id], pr = Object.keys(r.prices);
      var mid = pr.length === 1 ? r.q + ' × ' + num(+pr[0]) + ' = ' + money(r.s) : pcs(r.q) + ' = ' + money(r.s);
      L.push('• ' + b.t + ' — ' + mid + (byId(b.id) ? ' (ост. ' + (b.q - (all[b.id]||0)) + ')' : ''));
    });
  });
  return L.join('\n');
}

/* ---------- copy ---------- */
function copyText(text, okMsg){
  function fallback(){
    var ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly','');
    ta.style.position = 'fixed'; ta.style.top = '0'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
    var ok = false; try { ok = document.execCommand('copy'); } catch(e){}
    ta.remove();
    if (ok) toast(okMsg || 'Скопировано');
    else openModal('<h3>Скопируйте вручную<button class="x" data-act="close">×</button></h3><label class="fld"><textarea readonly>' + esc(text) + '</textarea></label><div class="hint">Нажмите на текст и удерживайте, чтобы выделить и скопировать.</div>');
  }
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function(){ toast(okMsg || 'Скопировано'); }, fallback);
      return;
    }
  } catch(e){}
  fallback();
}

/* ---------- modal ---------- */
var ov = $('#ov');
function openModal(html){
  ov.innerHTML = '<div class="sheet">' + html + '</div>';
  ov.classList.add('on');
  if (inTG && ver('6.1')) { try { tg.BackButton.show(); } catch(e){} }
}
function closeModal(){
  ov.classList.remove('on'); ov.innerHTML = '';
  if (inTG && ver('6.1')) { try { tg.BackButton.hide(); } catch(e){} }
}
if (inTG && ver('6.1')) { try { tg.BackButton.onClick(closeModal); } catch(e){} }
ov.addEventListener('click', function(e){ if (e.target === ov) closeModal(); });

var lastOwn = true;
var formImg; // undefined = auto by title, '' = no photo, id = chosen
function photoPicker(){
  var title = $('#f-t') ? $('#f-t').value : '';
  var sel = formImg === undefined ? autoImg(title) : (formImg || null);
  var el = $('#f-photos'); if (!el) return;
  el.innerHTML = '<button type="button" class="ph none' + (sel ? '' : ' on') + '" data-ph="">Без фото</button>' +
    CATALOG.map(function(c){
      return '<button type="button" class="ph' + (sel === c.id ? ' on' : '') + '" data-ph="' + c.id + '" title="' + esc(c.t + (c.v ? ', ' + c.v : '')) + '"><img src="' + imgSrc(c.id) + '" alt="' + esc(c.t) + '" loading="lazy"></button>';
    }).join('');
  var on = el.querySelector('.ph.on'); if (on && on.scrollIntoView) { try { on.scrollIntoView({ block:'nearest', inline:'center' }); } catch(e){} }
}
function openCatalog(){
  openModal('<h3>Каталог Anbar<button class="x" data-act="close">×</button></h3>' +
    '<div class="hint" style="margin-top:-6px">Нажмите на книгу: название, цена и фото заполнятся сами.</div>' +
    '<div class="cat">' + CATALOG.map(function(c){
      var have = state.books.some(function(b){ return imgOf(b) === c.id; });
      return '<button class="cat-i" data-cat="' + c.id + '"><img src="' + imgSrc(c.id) + '" alt="" loading="lazy">' +
        '<span class="cat-t">' + esc(c.t) + '</span>' + (c.v ? '<span class="cat-v">' + esc(c.v) + '</span>' : '') +
        '<span class="cat-p">' + money(c.pr) + (have ? ' <em>уже добавлена</em>' : '') + '</span></button>';
    }).join('') + '</div>');
}
function openForm(id, catId){
  var b = id ? byId(id) : null, own = b ? b.o : lastOwn;
  var cat = catId ? catById(catId) : null;
  if (cat && cat.mine) own = true;
  formImg = b ? b.img : (cat ? cat.id : undefined);
  var pubs = {}; state.books.forEach(function(x){ if (!x.o && x.p.trim()) pubs[x.p.trim()] = 1; });
  var sold = b ? (soldMaps().all[b.id] || 0) : 0;
  openModal(
    '<h3>' + (b ? 'Редактировать книгу' : 'Новая книга') + '<button class="x" data-act="close">×</button></h3>' +
    '<label class="fld">Название<input id="f-t" value="' + esc(b ? b.t : (cat ? cat.t + (cat.col && cat.v ? ' (' + cat.v.replace(' обложка','') + ')' : '') : '')) + '" placeholder="Например: Думай и уверуй"></label>' +
    '<div class="fld">Фото обложки<div class="photos" id="f-photos"></div></div>' +
    '<div class="seg' + (own ? '' : ' oth') + '" id="f-seg"><button type="button" data-own="1" class="' + (own ? 'on' : '') + '">Моё издательство</button>' +
    '<button type="button" data-own="0" class="' + (own ? '' : 'on') + '">Другое</button></div>' +
    '<label class="fld" id="f-p-wrap" style="' + (own ? 'display:none' : '') + '">Название издательства<input id="f-p" list="f-pubs" value="' + esc(b ? b.p : '') + '" placeholder="Издательство"></label>' +
    '<datalist id="f-pubs">' + Object.keys(pubs).map(function(p){ return '<option value="' + esc(p) + '">'; }).join('') + '</datalist>' +
    '<div class="two"><label class="fld">Цена, ₽<input id="f-pr" inputmode="decimal" value="' + (b ? b.pr : (cat ? cat.pr : '')) + '" placeholder="500"></label>' +
    '<label class="fld">Привезено, шт<input id="f-q" inputmode="numeric" value="' + (b ? b.q : '') + '" placeholder="20"></label></div>' +
    '<label class="fld">Закупочная цена, ₽ <span class="opt">(необязательно, видите только вы)</span><input id="f-c" inputmode="decimal" value="' + (b && b.c != null ? b.c : '') + '" placeholder="Почём взяли у оптовика"></label>' +
    (b ? '<div class="hint">Продано всего ' + sold + ', осталось ' + (b.q - sold) + '. Если довезли ещё, увеличьте «Привезено».</div>' : '') +
    '<div class="err" id="f-err"></div>' +
    '<button class="btn primary" data-act="save-book" data-id="' + esc(b ? b.id : '') + '">Сохранить</button>' +
    (b ? '<div class="btns"><button class="btn" data-act="toggle-hide" data-id="' + esc(b.id) + '">' + (b.h ? 'Вернуть в продажу' : 'Скрыть из продажи') + '</button>' +
         '<button class="btn danger" data-act="del-book" data-id="' + esc(b.id) + '">Удалить</button></div>' : '')
  );
  photoPicker();
  $('#f-t').addEventListener('input', function(){ if (formImg === undefined) photoPicker(); });
  if (!b && !cat) setTimeout(function(){ var el = $('#f-t'); if (el) el.focus(); }, 60);
  if (cat) setTimeout(function(){ var el = $('#f-q'); if (el) el.focus(); }, 60);
}
function saveBook(id){
  var t = $('#f-t').value.trim(), own = $('#f-seg .on').dataset.own === '1', p = $('#f-p').value.trim();
  var pr = parseNum($('#f-pr').value), qs = $('#f-q').value.trim(), q = qs === '' ? 0 : parseNum(qs);
  var cs_ = $('#f-c').value.trim(), c = cs_ === '' ? null : parseNum(cs_);
  var err = '';
  if (!t) err = 'Введите название книги';
  else if (!own && !p) err = 'Укажите издательство';
  else if (!isFinite(pr) || pr < 0) err = 'Укажите цену';
  else if (!isFinite(q) || q < 0) err = 'Количество — целое число';
  else if (c !== null && (!isFinite(c) || c < 0)) err = 'Закупочная цена — число или пусто';
  if (err) { $('#f-err').textContent = err; haptic('warn'); return; }
  q = Math.floor(q); lastOwn = own;
  var b = id ? byId(id) : null;
  if (b) { b.t = t; b.o = own; b.p = own ? '' : p; b.pr = pr; b.q = q; b.c = c; b.img = formImg; }
  else state.books.push({ id:uid(), t:t, o:own, p:own ? '' : p, pr:pr, q:q, h:false, c:c, img:formImg });
  persist(); closeModal(); renderAll(); haptic('ok');
  toast(b ? 'Сохранено' : 'Книга добавлена');
}

function openRestore(){
  openModal('<h3>Восстановить из копии<button class="x" data-act="close">×</button></h3>' +
    '<label class="fld">Вставьте текст резервной копии<textarea id="r-data" placeholder="{&quot;v&quot;:1,…}"></textarea></label>' +
    '<div class="err" id="r-err"></div>' +
    '<button class="btn primary" data-act="do-restore">Восстановить</button>' +
    '<div class="hint">Текущие книги и продажи будут заменены данными из копии.</div>');
}

/* ---------- tabs ---------- */
function showTab(t){
  ui.tab = t; saveUI();
  ['sell','books','report'].forEach(function(x){ $('#v-' + x).classList.toggle('on', x === t); });
  document.querySelectorAll('[data-tab]').forEach(function(b){ b.classList.toggle('on', b.dataset.tab === t); });
  renderTab(); window.scrollTo(0, 0);
}
function renderTab(){ if (ui.tab === 'sell') renderSell(); else if (ui.tab === 'books') renderBooks(); else renderReport(); }
function renderAll(){ renderTab(); }

/* ---------- events ---------- */
document.addEventListener('click', function(e){
  var t = e.target.closest('[data-ph],[data-cat],[data-ret],[data-minus],[data-sell],[data-tab],[data-filter],[data-period],[data-edit],[data-act],[data-delsale],[data-own]');
  if (!t) return;
  var d = t.dataset;
  if (d.ph !== undefined) {
    formImg = d.ph;
    if (d.ph && !$('#f-t').value.trim()) { var cc = catById(d.ph); if (cc) { $('#f-t').value = cc.t; if (!$('#f-pr').value.trim()) $('#f-pr').value = cc.pr; } }
    photoPicker(); return;
  }
  if (d.cat) { openForm(null, d.cat); return; }
  if (d.minus !== undefined) { e.preventDefault(); unsellLast(d.minus); return; }
  if (d.ret) {
    var rp = d.ret.split('|'), rts = +rp[0], rid = rp.slice(1).join('|');
    for (var k=state.sales.length-1;k>=0;k--) if (state.sales[k][0] === rts && state.sales[k][1] === rid) { returnSale(state.sales[k].slice()); break; }
    return;
  }
  if (d.sell !== undefined) { sell(d.sell); return; }
  if (d.tab) { showTab(d.tab); return; }
  if (d.filter) { ui.filter = d.filter; saveUI(); renderSell(); return; }
  if (d.period) { ui.period = d.period; renderReport(); return; }
  if (d.edit) { openForm(d.edit); return; }
  if (d.own !== undefined) {
    var own = d.own === '1';
    document.querySelectorAll('#f-seg button').forEach(function(b){ b.classList.toggle('on', b === t); });
    $('#f-seg').classList.toggle('oth', !own);
    $('#f-p-wrap').style.display = own ? 'none' : '';
    if (!own) $('#f-p').focus();
    return;
  }
  if (d.delsale) {
    var parts = d.delsale.split('|'), ts = +parts[0], bid = parts.slice(1).join('|'), bk = byId(bid);
    for (var q=state.sales.length-1;q>=0;q--) if (state.sales[q][0] === ts && state.sales[q][1] === bid) { returnSale(state.sales[q].slice()); break; }
    void bk;
    return;
  }
  switch (d.act) {
    case 'close': closeModal(); break;
    case 'add-book': openForm(null); break;
    case 'catalog': openCatalog(); break;
    case 'save-book': saveBook(d.id || null); break;
    case 'toggle-hide': {
      var b = byId(d.id); if (!b) break;
      b.h = !b.h; persist(); closeModal(); renderAll();
      toast(b.h ? 'Скрыта из продажи' : 'Возвращена в продажу');
      break;
    }
    case 'del-book': {
      var b2 = byId(d.id); if (!b2) break;
      var has = state.sales.some(function(s){ return s[1] === b2.id; });
      if (has) { alertDlg('У этой книги уже есть продажи, поэтому её нельзя удалить — иначе испортится отчёт. Нажмите «Скрыть из продажи».'); break; }
      confirmDlg('Удалить «' + b2.t.slice(0,120) + '»?', function(ok){
        if (!ok) return;
        state.books = state.books.filter(function(x){ return x.id !== b2.id; });
        persist(); closeModal(); renderAll(); toast('Книга удалена');
      });
      break;
    }
    case 'copy-report': copyText(reportText(), 'Отчёт скопирован — вставьте в любой чат'); break;
    case 'backup': copyText(JSON.stringify(state), 'Копия скопирована — сохраните её в «Избранное»'); break;
    case 'restore': openRestore(); break;
    case 'do-restore': {
      var txt = $('#r-data').value.trim(), parsed = null;
      try { parsed = normalize(JSON.parse(txt)); } catch(err){}
      if (!parsed || (!parsed.books.length && !parsed.sales.length)) { $('#r-err').textContent = 'Не похоже на резервную копию'; break; }
      confirmDlg('Заменить данные: ' + parsed.books.length + ' книг, ' + parsed.sales.length + ' продаж?', function(ok){
        if (!ok) return;
        state = parsed; persist(); closeModal(); renderAll(); toast('Данные восстановлены');
      });
      break;
    }
    case 'reset-sales': {
      if (!state.sales.length) { toast('Продаж пока нет'); break; }
      confirmDlg('Удалить все продажи (' + state.sales.length + ')? Книги останутся. Сначала скопируйте отчёт за всю ярмарку.', function(ok){
        if (!ok) return;
        state.sales = []; persist(); renderAll(); toast('Продажи обнулены');
      });
      break;
    }
  }
});
$('#search').addEventListener('input', function(e){ ui.q = e.target.value; renderGrid(); });
document.addEventListener('keydown', function(e){
  if (e.key === 'Enter' && ov.classList.contains('on') && e.target.tagName === 'INPUT') {
    var sv = ov.querySelector('[data-act="save-book"]'); if (sv) { e.preventDefault(); sv.click(); }
  }
});
document.addEventListener('visibilitychange', function(){ if (!document.hidden) renderAll(); else if (cloudDirty) flushCloud(); });

/* ---------- start ---------- */
showTab(ui.tab);
loadCloud();
})();
</script>
